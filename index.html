<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOPS — William Dumontaud</title>
<meta name="description" content="TOPS : optimisation énergétique de la topologie et de la forme d’une paroi de bâtiment — vitrine de la thèse de William Dumontaud.">
<link rel="icon" href="assets/tops.png">
<link rel="stylesheet" href="css/site.css">

<body>

<!-- fond animé : iso-lignes blanches sur bleu CNRS, comme la slide 1 de meeting/PUCPR_seminar2 -->
<canvas id="field" data-line="255,255,255" data-alpha="0.5"></canvas>

<!-- pas de bandeau sur l'accueil (les autres pages : css/bar.css) : la langue seule, en haut à droite ; gardée dans
     localStorage 'webpage.lang' (js/i18n.js) ; les bulles n'y passent pas (js/objects.js, zones interdites) -->
<div class="lang lang-float" role="group" aria-label="Langue / Language" title="Langue / Language">
  <button type="button" data-lang="fr">FR</button><button type="button" data-lang="en">EN</button>
</div>

<header class="masthead">
  <h1 class="tag" data-i18n="tagline">Optimisation de la forme et du domaine d’isolation au regard de l’efficacité énergétique des parois</h1>
</header>

<!-- les objets flottants (raccourcis) sont générés par js/objects.js depuis sa config ITEMS -->

<p class="hint" id="hint" data-i18n="hint">Les objets dérivent avec le courant — glissez-les pour les déplacer</p>

<!-- les logos des institutions flottent comme des bulles (voir ITEMS dans js/objects.js) -->
<footer class="foot">
  <p class="credit" data-i18n="credit">William Dumontaud — LaSIE, La Rochelle Université · IUSTI, Aix-Marseille Université</p>
</footer>

<script src="js/field.js"></script>
<script src="js/i18n.js"></script>
<script src="js/objects.js"></script>
<script src="js/main.js"></script>
</body>
