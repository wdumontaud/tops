// ---- Solar position (NOAA simplified algorithm) -------------------------
// Simulation time t is in seconds from january 1st 00:00 (local standard
// time, as in modifyTime): day of year = 1 + floor(t/86400).
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MDAYS = [31,28,31,30,31,30,31,31,30,31,30,31];
function dateLabel(dayOfYear){
  let d = ((dayOfYear-1) % 365 + 365) % 365, m = 0;
  while (d >= MDAYS[m]) { d -= MDAYS[m]; m++; }
  return String(d+1).padStart(2,'0')+' '+MONTHS[m];
}
// horizontal north / east unit vectors of the scene (Domus:Norte, y = up)
const NORTH = (() => { const n = D.north || [0,0,-1], l = Math.hypot(n[0], n[2]) || 1; return [n[0]/l, n[2]/l]; })();
const EAST = [-NORTH[1], NORTH[0]]; // north x up, in (x, z)

function solarPosition(lat, lon, tz, dayOfYear, hourDecimal){
  const rad = Math.PI/180;
  const gamma = 2*Math.PI/365 * (dayOfYear - 1 + (hourDecimal-12)/24);
  const eqtime = 229.18*(0.000075 + 0.001868*Math.cos(gamma) - 0.032077*Math.sin(gamma)
    - 0.014615*Math.cos(2*gamma) - 0.040849*Math.sin(2*gamma));
  const decl = 0.006918 - 0.399912*Math.cos(gamma) + 0.070257*Math.sin(gamma)
    - 0.006758*Math.cos(2*gamma) + 0.000907*Math.sin(2*gamma)
    - 0.002697*Math.cos(3*gamma) + 0.00148*Math.sin(3*gamma);
  const timeOffset = eqtime + 4*lon - 60*tz;
  const trueSolarTime = hourDecimal*60 + timeOffset;
  let haDeg = (trueSolarTime/4) - 180;
  const ha = haDeg*rad;
  const latR = lat*rad;
  const cosZenith = Math.sin(latR)*Math.sin(decl) + Math.cos(latR)*Math.cos(decl)*Math.cos(ha);
  const zenith = Math.acos(Math.max(-1, Math.min(1, cosZenith)));
  const altitude = Math.PI/2 - zenith;
  let cosAz = (Math.sin(decl) - Math.sin(latR)*Math.cos(zenith)) / (Math.cos(latR)*Math.sin(zenith) || 1e-9);
  cosAz = Math.max(-1, Math.min(1, cosAz));
  let azimuth = Math.acos(cosAz);
  if (ha > 0) azimuth = 2*Math.PI - azimuth;
  return {altitude, azimuth}; // radians; azimuth from north, clockwise
}

function updateSun(tSec){
  const dayOfYear = 1 + Math.floor(tSec/86400);
  let hourDecimal = ((tSec % 86400) + 86400) % 86400 / 3600;
  const pos = solarPosition(D.lat, D.lon, D.tz, dayOfYear, hourDecimal);
  const altDeg = pos.altitude*180/Math.PI, azDeg = pos.azimuth*180/Math.PI;
  const info = document.getElementById('sunInfo');
  let hh = Math.floor(hourDecimal), mm = Math.round((hourDecimal-hh)*60);
  if (mm === 60) { hh += 1; mm = 0; }
  const stamp = dateLabel(dayOfYear)+' '+String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  if (pos.altitude <= 0){
    sun.intensity = 0.05;
    info.textContent = stamp+' — sun below horizon';
  } else {
    sun.intensity = 0.95;
    info.textContent = stamp+' — alt '+altDeg.toFixed(1)+'° az '+azDeg.toFixed(1)+'°';
  }

  const az = pos.azimuth; // 0 = north, clockwise
  const h = r*Math.cos(Math.max(pos.altitude, 0.02));

  if (Math.hypot(fx, fz) < 1e-3){ const u = camera.up.clone().applyQuaternion(camera.quaternion); fx = u.x; fz = u.z; }
  const fwd = Math.atan2(fx*EAST[0] + fz*EAST[1], fx*NORTH[0] + fz*NORTH[1]);   // azimuth of the view
  needle.setAttribute('transform', 'rotate(' + (-fwd*180/Math.PI) + ')');

// ---- face information on click ---------------------------------------------
const TYPE_LABEL = {wall: 'wall', window: 'window', roof: 'roof', floor: 'floor / ceiling', ground: 'ground',

const ray = new THREE.Raycaster();
let downAt = null, picked = null;

hl.renderOrder = 10; hl.visible = false; scene.add(hl);
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || e.button !== 0 || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4) return;
  const m = new THREE.Vector2(e.clientX/innerWidth*2 - 1, -e.clientY/innerHeight*2 + 1);
  ray.setFromCamera(m, camera);
  const meshes = faceMeshes.filter(f => f.mesh.parent && f.mesh.parent.visible !== false).map(f => f.mesh);
  const hit = ray.intersectObjects(meshes, false)[0];
  const f = hit && faceMeshes.find(x => x.mesh === hit.object);
  if (!f || f === picked){ picked = null; hl.visible = false; pickBox.style.display = 'none'; return; }
  picked = f;
  hl.geometry.dispose();
  hl.geometry = new THREE.BufferGeometry().setFromPoints(f.verts.map(v => new THREE.Vector3(...v)));
  hl.visible = true;

});
function showPick(x, y){
  const f = picked;
  if (!f) return;
  const tilt = Math.acos(Math.min(1, Math.abs(f.out[1])))*180/Math.PI;
  const rows = ['<b>' + f.zone + '</b> <span>' + TYPE_LABEL[f.type] + '</span>',
                '<span>area</span> ' + f.area.toFixed(2) + ' m²'];
  if (f.type === 'wall' || f.type === 'window' || f.type === 'roof')
    rows.push('<span>faces</span> ' + compassLabel(faceAzimuth(f.out)) + ' <span>· tilt</span> ' + tilt.toFixed(0) + '°');
  rows.push('<span>direct sun now</span> ' + Math.round(irradiance(f)) + ' W/m²');
  const tz = tpAt(f.zone, (sunNow.doy - 1)*86400 + sunNow.hour*3600);
  if (tz != null) rows.push('<span>zone temperature now</span> ' + tz.toFixed(1) + ' \u00b0C');
  const sh = shCache[sunNow.doy];
  if (sh) rows.push('<span>sunlit on ' + dateLabel(sunNow.doy) + '</span> ' + sh.hours[faceMeshes.indexOf(f)].toFixed(1) + ' h');
  pickBox.innerHTML = rows.join('<br>');
  pickBox.style.display = 'block';
  if (x != null){
    pickBox.style.left = Math.min(x + 14, innerWidth - pickBox.offsetWidth - 8) + 'px';
    pickBox.style.top = Math.min(y + 14, innerHeight - pickBox.offsetHeight - 60) + 'px';

}

// ---- sun path in the sky (day of the view + the two solstices) ----------

const SKY_R = span*0.55;   // fits the default framing, well above the buildings

function skyDepth(){
  skyGroup.traverse(o => { if (o.material){ o.material.depthTest = !realOn; o.renderOrder = realOn ? 10 : 0; } });
}
function skyPoint(dayOfYear, hourDecimal){   // null below the horizon
  const p = solarPosition(D.lat, D.lon, D.tz, dayOfYear, hourDecimal);
  if (p.altitude <= 0) return null;
  const h = SKY_R*Math.cos(p.altitude), az = p.azimuth;
  return new THREE.Vector3(ctr[0] + h*(Math.cos(az)*NORTH[0] + Math.sin(az)*EAST[0]),
                           boundsMin[1] + SKY_R*Math.sin(p.altitude),   // horizon = the ground
                           ctr[2] + h*(Math.cos(az)*NORTH[1] + Math.sin(az)*EAST[1]));
}
function skyArc(dayOfYear, step){
  const pts = [];
  for (let h = 0; h <= 24.0001; h += step){ const p = skyPoint(dayOfYear, h); if (p) pts.push(p); }
  return pts;
}
// solstice paths: fixed envelope of the sun over the year, dashed
[172, 355].forEach(doy => {

    new THREE.LineDashedMaterial({color: 0x7d8ea3, dashSize: span*0.05, gapSize: span*0.04,
                                  transparent: true, opacity: 0.6, toneMapped: false, fog: false}));
  line.computeLineDistances();

});
let dayArc = null, dayDots = null;

  [dayArc, dayDots].forEach(o => { if (o){ skyGroup.remove(o); o.geometry.dispose(); } });
  dayArc = dayDots = null;
  const pts = skyArc(dayOfYear, 1/6);
  if (pts.length < 2) return;
  dayArc = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color: 0xffbd6b, transparent: true, opacity: 0.9, toneMapped: false, fog: false}));
  skyDepth();
  skyGroup.add(dayArc);
  const hours = [];
  for (let h = 0; h <= 24; h++){ const p = skyPoint(dayOfYear, h); if (p) hours.push(p); }
  if (hours.length){
    dayDots = new THREE.Points(new THREE.BufferGeometry().setFromPoints(hours),
      new THREE.PointsMaterial({color: 0xffd18a, size: span*0.012, sizeAttenuation: true, toneMapped: false, fog: false}));
    skyGroup.add(dayDots);

// ---- time control: day + hour, key days, three play modes ---------------
const DAY0 = Math.floor(D.t_start/86400);                  // first simulated day (0 = january 1st)
const DAYN = Math.max(DAY0, Math.floor((D.t_end - 1e-6)/86400));
const NDAYS = DAYN - DAY0 + 1;
const H0 = Math.min(23.5, Math.max(0, (D.t_start - DAY0*86400)/3600));   // first / last hour simulated
const H1 = Math.min(24, Math.max(0.5, (D.t_end - DAYN*86400)/3600));
const playBtn = document.getElementById('playBtn');
const dayBtn = document.getElementById('dayBtn');
const panel = document.getElementById('timepanel');
const hourSlider = document.getElementById('hourSlider');
const daySlider = document.getElementById('daySlider');
const dayLab = document.getElementById('dayLab');
let dayIdx = 0, hour = 12, dayF = 0, mode = NDAYS > 7 ? 'day' : 'period';
let arcDay = -1;

function hourSpan(idx){        // hours of that day inside [t_start, t_end]
  const lo = idx === 0 ? H0 : 0, hi = idx === NDAYS-1 ? H1 : 24;
  return [lo, Math.max(hi, lo + 0.5)];
}
function setTime(idx, h){
  dayIdx = Math.max(0, Math.min(NDAYS-1, Math.floor(idx)));
  const sp = hourSpan(dayIdx);
  hour = Math.max(sp[0], Math.min(sp[1], h));
  hourSlider.min = sp[0]; hourSlider.max = sp[1]; hourSlider.value = hour;
  daySlider.value = dayIdx;
  const doy = DAY0 + dayIdx + 1;
  const stamp = dateLabel(doy);
  dayBtn.textContent = stamp + ' \u25be';
  dayLab.textContent = '\u2014 ' + stamp + (NDAYS > 1 ? ' (' + (dayIdx+1) + '/' + NDAYS + ')' : '');
  if (dayIdx !== arcDay){ arcDay = dayIdx; buildDayArc(doy); }
  shUpdate(doy);
  updateSun((DAY0 + dayIdx)*86400 + hour*3600);
  const p = skyPoint(doy, hour);
  marker.visible = !!p;
  if (p) marker.position.copy(p);
  timeHooks.forEach(h => h(doy, hour));
}
function setFromT(t){                        // absolute time in seconds (period mode)
  const d = Math.floor(t/86400) - DAY0;
  setTime(d, (t - (DAY0 + d)*86400)/3600);
}

// play modes: 'day' = the 24 h of the day (~12 s), 'days' = same hour day after
// day (whole period in 6-25 s), 'period' = continuous (legacy, >= 3 s per day)
let playing = false, lastTs = null;
function playStep(ts){
  if (!playing) return;
  if (lastTs !== null){
    const dt = Math.min((ts - lastTs)/1000, 0.25);
    if (mode === 'day'){
      const sp = hourSpan(dayIdx), spd = (sp[1] - sp[0])/12;
      let h = hour + spd*dt;
      if (h > sp[1]) h = sp[0] + (h - sp[1]);
      setTime(dayIdx, h);
    } else if (mode === 'days'){
      dayF += dt*NDAYS/Math.max(6, Math.min(25, NDAYS*0.06));
      if (dayF >= NDAYS) dayF -= NDAYS;
      setTime(dayF, hour);
    } else {
      const days = Math.max((D.t_end - D.t_start)/86400, 1e-6);
      let t = (DAY0 + dayIdx)*86400 + hour*3600 + dt/Math.max(20, 3*days)*(D.t_end - D.t_start);
      if (t > D.t_end) t = D.t_start + (t - D.t_end);

    }

function setPlaying(on){
  playing = on;

  playBtn.innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
  lastTs = null;
  if (playing){ dayF = dayIdx; requestAnimationFrame(playStep); }
  else shUpdate(DAY0 + dayIdx + 1, true);   // catch up if the map was frozen while playing
}
playBtn.onclick = () => setPlaying(!playing);

hourSlider.oninput = () => setTime(dayIdx, parseFloat(hourSlider.value));
daySlider.oninput = () => { dayF = parseInt(daySlider.value); setTime(dayF, hour); };
[hourSlider, daySlider].forEach(s => s.addEventListener('pointerdown', () => { if (playing) setPlaying(false); }));

// day slider + key days of the period (solstices / equinoxes, first day)
daySlider.max = NDAYS - 1;
document.getElementById('dayRow').hidden = NDAYS < 2;
const chipBox = document.getElementById('chips');
function addChip(label, idx, title){

const SOUTH = D.lat < 0;   // seasons of the site's hemisphere
const KEYDAYS = [[79, SOUTH ? 'autumn equinox' : 'spring equinox'],
                 [172, SOUTH ? 'winter solstice' : 'summer solstice'],

  return isFinite(a[0]) ? Math.max(b[0] - a[0], b[2] - a[2], 5) : span;

    if (n.dot(ctr.clone().sub(cen)) < 0) n.negate();

    [0, 1, 1, 2, 2, 3, 3, 0].forEach(i => line.push(q[i].x, q[i].y, q[i].z));

lgd.innerHTML = '<div style="font-weight:600;margin-bottom:3px">View factors of the studied facade</div>'

  lgd.style.display = on ? 'block' : 'none'; chk.checked = on;
  updLayers(); invalidate();
};
chk.onchange = () => setLw(chk.checked);

// ---- what the page of the site drives (its scrolling): camera, time, layer
const v3 = a => new THREE.Vector3(...a);
window.__site = {
  ready: true,
  pose(p) { flight = null; camera.position.copy(v3(p.pos)); controls.target.copy(v3(p.target));

  getPose() { return {pos: camera.position.toArray(), target: controls.target.toArray(), fov: camera.fov}; },

  getTime() { return [dayIdx, hour]; },
